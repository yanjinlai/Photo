<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>現況調查記錄</title>
<script>
  // 自動避開瀏覽器/GitHub Pages快取:網址沒有帶版本參數時,自動導向一個帶時間戳記的新網址,
  // 讓瀏覽器一定要重新跟伺服器要最新內容,不會拿到快取的舊版本。之後不用再手動打?v=數字。
  (function(){
    if(location.search.indexOf("_v=") === -1){
      var sep = location.search ? "&" : "?";
      location.replace(location.pathname + location.search + sep + "_v=" + Date.now());
    }
  })();
</script>

<!--
  =====================================================================
  設定說明
  =====================================================================
  Firebase 設定值(FIREBASE_CONFIG)已經內建在下面,對應 water-soil-tracker
  這個專案、/fieldSurvey 這個資料庫路徑。之後每次拿到新版檔案,直接整支
  上傳覆蓋 index.html 即可,不需要再手動修改這段。

  第一次部署時需要做過(如果已經做過,以後新版都不用再重做):
  1. Firebase Console → Authentication → Sign-in method → 啟用「匿名」(Anonymous)
  2. Firebase Console → Realtime Database → Rules,貼上:
     {
       "rules": {
         "fieldSurvey": {
           ".read": "auth != null",
           ".write": "auth != null"
         }
       }
     }
  3. 存檔後部署上線即可用手機開啟拍照上傳(Netlify拖曳上傳,或GitHub Pages:
     新開一個repo、把這支檔案改名為index.html上傳、Settings→Pages設定為
     Deploy from a branch / main / root)
  =====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F5F2EA;
    --grid-line:#DCD5C2;
    --ink:#232A24;
    --ink-soft:#666F63;
    --card:#FFFFFF;
    --border:#D8D2BF;
    --accent:#D9601C;      /* 安全橘 - 主要動作 */
    --accent-ink:#FFFFFF;
    --accent-soft:#FBE6D8;
    --teal:#1F6F68;        /* 測量藍綠 - 設施/標籤 */
    --teal-soft:#E4EEEC;
    --danger:#B23B3B;
    --danger-soft:#F6E4E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:22px 22px;
    min-height:100vh;
    padding-bottom:90px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    padding:14px 16px 10px;
  }
  .brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .brand h1{font-size:1.15rem; font-weight:700; margin:0; letter-spacing:.02em;}
  .brand .tag{font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-soft); border:1px solid var(--border); padding:2px 6px; border-radius:4px; white-space:nowrap;}
  .status-line{display:flex; align-items:center; gap:6px; margin-top:4px; font-size:.72rem; color:var(--ink-soft);}
  .dot{width:7px; height:7px; border-radius:50%; background:#999;}
  .dot.on{background:#2E8B57;}
  .dot.off{background:var(--danger);}

  nav.tabs{display:flex; gap:8px; margin-top:12px;}
  nav.tabs button{
    flex:1; padding:9px 6px; border-radius:8px; border:1.5px solid var(--ink);
    background:var(--card); color:var(--ink); font-weight:600; font-size:.86rem;
    cursor:pointer;
  }
  nav.tabs button.active{background:var(--ink); color:var(--paper);}

  main{padding:14px 16px 8px; max-width:640px; margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---------- 卡片 / 通用元件 ---------- */
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:14px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
  }
  .field-label{font-size:.78rem; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block; letter-spacing:.01em;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%; max-width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:7px;
    font-family:'IBM Plex Sans',sans-serif; font-size:.92rem; color:var(--ink); background:#FEFEFD;
  }
  input[type=date]{ padding:10px 6px; font-size:.85rem; }
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  textarea{resize:vertical; min-height:60px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .field-group{margin-bottom:12px;}

  /* ---------- 設施類型選擇(兩層:大分類→排水溝斷面子類) ---------- */
  .type-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:14px;}
  .type-card{
    border:1.5px solid var(--border); border-radius:8px; background:#fff;
    padding:10px 4px 8px; text-align:center; cursor:pointer;
  }
  .type-card svg{width:44px; height:32px;}
  .type-card .lbl{display:block; font-size:.76rem; font-weight:600; margin-top:4px;}

  /* 第一層:大分類(排水溝/集水井/管涵/沉砂滯洪池) - 選中用主要動作橘色,較顯眼 */
  #groupGrid .type-card{border-width:2px; padding:14px 6px 11px;}
  #groupGrid .type-card svg{width:50px; height:36px;}
  #groupGrid .type-card .lbl{font-size:.84rem; font-weight:700;}
  #groupGrid .type-card.active{border-color:var(--accent); background:var(--accent-soft);}

  /* 第二層:排水溝斷面子類 - 包在虛線框內,視覺上明顯是「排水溝」底下展開的子選項,選中用測量藍綠 */
  .subtype-wrap{
    display:none; border:1.5px dashed var(--teal); border-radius:8px;
    background:var(--teal-soft); padding:10px 8px 8px; margin:-4px 0 14px;
  }
  .subtype-label{
    font-size:.72rem; font-weight:700; color:var(--teal); margin-bottom:8px;
    display:flex; align-items:center; gap:4px; letter-spacing:.02em;
  }
  .subtype-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px;}
  .subtype-grid .type-card{padding:8px 4px 6px; background:#fff;}
  .subtype-grid .type-card svg{width:36px; height:26px;}
  .subtype-grid .type-card .lbl{font-size:.72rem;}
  .subtype-grid .type-card.active{border-color:var(--teal); background:var(--teal-soft);}

  .dim-field{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dim-field label{width:96px; font-size:.82rem; color:var(--ink-soft); flex-shrink:0;}
  .dim-field .unit{font-size:.76rem; color:var(--ink-soft); width:16px;}

  /* ---------- chips ---------- */
  .chip-wrap{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{
    padding:6px 12px; border-radius:999px; border:1.5px solid var(--border); background:#fff;
    font-size:.8rem; cursor:pointer; color:var(--ink-soft);
  }
  .chip.on{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:600;}

  /* ---------- 照片 ---------- */
  .photo-actions{display:flex; gap:8px; margin-bottom:10px;}
  .btn-outline{
    flex:1; padding:10px; border-radius:8px; border:1.5px solid var(--ink); background:#fff;
    font-weight:600; font-size:.85rem; cursor:pointer; color:var(--ink);
  }
  .thumb-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .thumb{position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; border:1px solid var(--border);}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rm{
    position:absolute; top:2px; right:2px; background:rgba(30,30,30,.75); color:#fff;
    border:none; width:20px; height:20px; border-radius:50%; font-size:.75rem; line-height:1; cursor:pointer;
  }
  .thumb .rotate-btn{
    position:absolute; bottom:2px; left:2px; background:rgba(30,30,30,.75); color:#fff;
    border:none; width:22px; height:22px; border-radius:50%; font-size:.9rem; line-height:1; cursor:pointer;
  }

  /* ---------- 主要按鈕 ---------- */
  .btn-primary{
    width:100%; padding:13px; border-radius:9px; border:none; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:.98rem; cursor:pointer; letter-spacing:.02em;
  }
  .btn-primary:active{opacity:.85;}
  .btn-secondary{
    width:100%; padding:11px; border-radius:9px; border:1.5px solid var(--border); background:#fff;
    color:var(--ink-soft); font-weight:600; font-size:.88rem; cursor:pointer; margin-top:8px;
  }

  /* ---------- 列表 ---------- */
  .toolbar{display:flex; gap:8px; margin-bottom:12px;}
  .toolbar input{flex:1;}
  .toolbar .btn-outline{flex:0 0 auto; padding:10px 12px;}

  .site-group{margin-bottom:20px;}
  .site-group-header{
    font-weight:700; font-size:.9rem; padding-bottom:6px; margin-bottom:10px;
    border-bottom:1.5px solid var(--ink); display:flex; align-items:baseline; gap:6px;
  }
  .site-group-count{font-weight:400; color:var(--ink-soft); font-size:.72rem;}

  .record-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; margin-bottom:10px; display:flex; gap:12px; cursor:pointer;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  }
  .record-card .thumb0{width:64px; height:64px; border-radius:7px; overflow:hidden; flex-shrink:0; background:var(--teal-soft); display:flex; align-items:center; justify-content:center;}
  .record-card .thumb0 img{width:100%; height:100%; object-fit:cover;}
  .record-card .thumb0 svg{width:34px; height:26px;}
  .rc-body{flex:1; min-width:0;}
  .rc-top{display:flex; justify-content:space-between; gap:6px;}
  .rc-site{font-weight:700; font-size:.94rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rc-date{font-size:.7rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; flex-shrink:0;}
  .rc-type{display:inline-block; font-size:.7rem; font-weight:600; color:var(--teal); background:var(--teal-soft); padding:1px 7px; border-radius:5px; margin:3px 0 5px;}
  .rc-dims{font-family:'IBM Plex Mono',monospace; font-size:.82rem; color:var(--ink);}
  .rc-status{margin-top:5px; display:flex; flex-wrap:wrap; gap:4px;}
  .rc-status span{font-size:.67rem; background:var(--paper); border:1px solid var(--border); padding:1px 6px; border-radius:5px; color:var(--ink-soft);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state svg{width:60px; opacity:.5; margin-bottom:10px;}

  /* ---------- modal ---------- */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(20,20,15,.55); z-index:50;
    align-items:flex-end; justify-content:center;
  }
  .modal-bg.active{display:flex;}
  .modal{
    background:var(--paper); width:100%; max-width:640px; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; padding:18px 16px 24px; border-top:3px solid var(--ink);
  }
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 12px;}
  .modal h2{font-size:1.05rem; margin:0 0 4px;}
  .modal .close-x{position:absolute; top:14px; right:16px; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--ink-soft);}
  .detail-row{margin-bottom:10px; font-size:.88rem;}
  .detail-row .k{color:var(--ink-soft); font-size:.72rem; display:block; margin-bottom:2px;}
  .gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:6px;}
  .gallery img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:80; align-items:center; justify-content:center;}
  .lightbox.active{display:flex;}
  .lightbox img{max-width:94%; max-height:88%; border-radius:6px;}
  .lightbox .close-x{position:absolute; top:18px; right:20px; color:#fff; font-size:1.6rem; background:none; border:none; cursor:pointer;}

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:20px;
    font-size:.82rem; z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>現況調查記錄</h1>
    <span class="tag mono">排水設施 · 現場調查</span>
  </div>
  <div class="status-line"><span class="dot" id="connDot"></span><span id="connText">連線中…</span></div>
  <nav class="tabs">
    <button id="tabAddBtn" class="active" onclick="switchTab('add')">＋ 新增記錄</button>
    <button id="tabListBtn" onclick="switchTab('list')">📋 記錄列表</button>
  </nav>
</header>

<main>

  <!-- ============ 開始調查(工作階段設定) ============ -->
  <section id="view-session" class="view active">
    <div class="panel">
      <div class="field-group">
        <label class="field-label">調查日期</label>
        <input type="date" id="s-date">
      </div>
      <div class="field-group">
        <label class="field-label">案件 / 調查地點</label>
        <input type="text" id="s-site" list="siteList" placeholder="例如:○○案 - 排水溝NU3段">
        <datalist id="siteList"></datalist>
      </div>
      <button class="btn-primary" onclick="startSession()">開始調查 →</button>
    </div>
  </section>

  <!-- ============ 新增 / 編輯 ============ -->
  <section id="view-add" class="view">
    <div class="panel" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;">
      <div style="min-width:0;">
        <div style="font-weight:700; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="sessionSiteDisplay"></div>
        <div class="mono" style="font-size:.72rem; color:var(--ink-soft); margin-top:2px;" id="sessionDateDisplay"></div>
      </div>
      <button type="button" class="btn-outline" style="flex:0 0 auto; padding:8px 12px; font-size:.78rem;" onclick="goToSession()">🔄 換案件/日期</button>
      <input type="hidden" id="f-site">
      <input type="hidden" id="f-date">
    </div>

    <div class="panel">
      <div class="field-group">
        <label class="field-label">編號</label>
        <input type="text" id="f-code" placeholder="例如:NU1、A1">
      </div>
      <label class="field-label">設施類型</label>
      <div class="type-grid" id="groupGrid"></div>
      <div class="subtype-wrap" id="subGridWrap">
        <div class="subtype-label">↳ 排水溝斷面類型</div>
        <div class="subtype-grid" id="subGrid"></div>
      </div>
      <div id="dimFields"></div>
    </div>

    <div class="panel">
      <label class="field-label">現場座標(選填)</label>
      <button type="button" class="btn-outline" onclick="getLocation()">📍 取得目前位置</button>
      <div id="gpsResult" class="mono" style="font-size:.8rem; color:var(--ink-soft); margin-top:8px;"></div>
    </div>

    <div class="panel">
      <label class="field-label">照片</label>
      <div class="photo-actions">
        <button type="button" class="btn-outline" onclick="document.getElementById('galleryInput').click()">🖼️ 從相簿選取</button>
      </div>
      <input type="file" id="galleryInput" accept="image/*" multiple style="display:none;">
      <div class="thumb-grid" id="photoThumbs"></div>
    </div>

    <div class="panel">
      <label class="field-label">備註</label>
      <textarea id="f-notes" placeholder="其他現場說明…"></textarea>
    </div>

    <button class="btn-primary" onclick="saveRecord()" id="saveBtn">儲存記錄</button>
    <button class="btn-secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">取消編輯</button>
  </section>

  <!-- ============ 列表 ============ -->
  <section id="view-list" class="view">
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="搜尋案件名稱 / 備註…" oninput="renderList()">
      <button class="btn-outline" onclick="exportCSV()">⭳ CSV</button>
    </div>
    <div id="recordList"></div>
  </section>

</main>

<!-- 詳細/編輯 modal -->
<div class="modal-bg" id="detailModal">
  <div class="modal" style="position:relative;">
    <button class="close-x" onclick="closeDetail()">✕</button>
    <div class="modal-handle"></div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close-x" onclick="closeLightbox(event)">✕</button>
  <img id="lightboxImg" src="">
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* =====================================================================
   請填入你自己的 Firebase 設定(Firebase Console → 專案設定 → 一般 → 你的應用程式)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAM3B_5Ot2M_X5eptAYeGsTJg4Tv2vYTXU",
  authDomain: "water-soil-tracker.firebaseapp.com",
  databaseURL: "https://water-soil-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "water-soil-tracker",
  storageBucket: "water-soil-tracker.firebasestorage.app",
  messagingSenderId: "1052261254358",
  appId: "1:1052261254358:web:eac43a49e40338f678f577"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const DB_PATH = "fieldSurvey/records";

/* ---------------------------------------------------------------------
   設施類型設定(icon 為簡易斷面示意圖)
--------------------------------------------------------------------- */
const FACILITY_TYPES = {
  rect: {
    label: "矩形溝",
    icon: `<svg viewBox="0 0 60 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="10" width="40" height="26" stroke="#1F6F68" stroke-width="2.5"/>
      <line x1="10" y1="4" x2="50" y2="4" stroke="#1F6F68" stroke-width="1"/>
      <line x1="10" y1="1" x2="10" y2="7" stroke="#1F6F68" stroke-width="1"/>
      <line x1="50" y1="1" x2="50" y2="7" stroke="#1F6F68" stroke-width="1"/>
      <line x1="55" y1="10" x2="55" y2="36" stroke="#1F6F68" stroke-width="1"/>
      <line x1="52" y1="10" x2="58" y2="10" stroke="#1F6F68" stroke-width="1"/>
      <line x1="52" y1="36" x2="58" y2="36" stroke="#1F6F68" stroke-width="1"/>
    </svg>`,
    fields: [
      { key: "width", label: "溝寬 W" },
      { key: "depth", label: "溝深 H" },
      { key: "wallThickness", label: "壁厚", optional: true },
      { key: "coverThickness", label: "蓋板厚度", optional: true }
    ],
    unit: "cm",
    dimText: d => `W${fmt(d.width)}×H${fmt(d.depth)} cm`
  },
  trapezoid: {
    label: "梯形溝",
    icon: `<svg viewBox="0 0 60 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="10,10 50,10 42,36 18,36" stroke="#1F6F68" stroke-width="2.5"/>
      <line x1="10" y1="4" x2="50" y2="4" stroke="#1F6F68" stroke-width="1"/>
      <line x1="10" y1="1" x2="10" y2="7" stroke="#1F6F68" stroke-width="1"/>
      <line x1="50" y1="1" x2="50" y2="7" stroke="#1F6F68" stroke-width="1"/>
      <line x1="18" y1="40" x2="42" y2="40" stroke="#1F6F68" stroke-width="1"/>
    </svg>`,
    fields: [
      { key: "bottomWidth", label: "底寬" },
      { key: "topWidth", label: "頂寬" },
      { key: "depth", label: "溝深 H" },
      { key: "slope", label: "邊坡(1:n)", optional: true }
    ],
    unit: "cm",
    dimText: d => `底${fmt(d.bottomWidth)}/頂${fmt(d.topWidth)}×H${fmt(d.depth)} cm`
  },
  parabolic: {
    label: "拋物線形溝",
    icon: `<svg viewBox="0 0 60 44" fill="none" xmlns="http://www.w3.org/2000/svg">

/* ---------------------------------------------------------------------
   Firebase 連線 / 匿名登入 / 即時同步
--------------------------------------------------------------------- */
firebase.auth().onAuthStateChanged(user => {
  if(user){
    setConn(true);
    db.ref(DB_PATH).on("value", snap => {
      records = snap.val() || {};
      renderList();
      refreshSiteList();
    });
  } else {
    firebase.auth().signInAnonymously().catch(err => {
      setConn(false, err.message);
      scheduleRetryConnect();
    });
  }
});
firebase.auth().signInAnonymously().catch(err => {
  setConn(false, err.message);
  scheduleRetryConnect();
});

let retryTimer = null;
let retryDelay = 3000;
function scheduleRetryConnect(){
  if(retryTimer) return;
  retryTimer = setTimeout(() => {
    retryTimer = null;
    retryDelay = Math.min(retryDelay * 1.6, 20000);
    firebase.auth().signInAnonymously().catch(err => {
      setConn(false, err.message);
      scheduleRetryConnect();
    });
  }, retryDelay);
}
// 手機從背景切回來(例如拍照後回到網頁)時,主動檢查一次連線狀態,連線失敗就立刻重試,不用等使用者手動整頁重新整理
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && !firebase.auth().currentUser){
    retryDelay = 3000;
    firebase.auth().signInAnonymously().catch(err => {
      setConn(false, err.message);
      scheduleRetryConnect();
    });
  }
});

function setConn(ok, msg){
  document.getElementById("connDot").className = "dot " + (ok ? "on" : "off");
  document.getElementById("connText").innerHTML = ok
    ? "已連線 · 即時同步中"
    : ("連線失敗" + (msg?"："+msg:"") + "(自動重試中…) " + `<button type="button" onclick="manualRetryConnect()" style="margin-left:6px; padding:2px 8px; border-radius:10px; border:1px solid var(--border); background:#fff; font-size:.7rem; cursor:pointer;">重試</button>`);
}
function manualRetryConnect(){
  retryDelay = 3000;
  firebase.auth().signInAnonymously().catch(err => {
    setConn(false, err.message);
    scheduleRetryConnect();
  });
}

function getLocation(){
  const out = document.getElementById("gpsResult");
  if(!navigator.geolocation){ out.textContent = "此裝置不支援定位"; return; }
  out.textContent = "定位中…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      gpsData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      out.textContent = `${gpsData.lat.toFixed(6)}, ${gpsData.lng.toFixed(6)}`;
    },
    err => { out.textContent = "取得位置失敗：" + err.message; },
    { enableHighAccuracy:true, timeout:10000 }
  );
}

/* ---------------------------------------------------------------------
   照片：讀取(自動依EXIF修正拍攝方向) + 壓縮 + 縮圖
--------------------------------------------------------------------- */
async function handleFiles(fileList){
  for(const file of Array.from(fileList)){
    try{
      const source = await loadOrientedImage(file);
      const compressed = drawToDataUrl(source, 1280, 0.7);
      pendingPhotos.push(compressed);
      renderThumbs();
    }catch(err){
      showToast("照片讀取失敗："+err.message);
    }
  }
}
// 讀取圖片並依照片本身的EXIF方向資訊自動轉正(手機橫向拍攝常見問題)
async function loadOrientedImage(file){
  if(window.createImageBitmap){
    try{
      return await createImageBitmap(file, {imageOrientation:"from-image"});
    }catch(e){ /* 部分瀏覽器不支援選項,退回下面的方式 */ }
  }
  return await new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("圖片格式無法讀取"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("檔案讀取失敗"));
    reader.readAsDataURL(file);
  });
}
function drawToDataUrl(source, maxW, quality){
  const w = source.width, h = source.height;
  const scale = Math.min(1, maxW / w);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", quality);
}
document.getElementById("galleryInput").addEventListener("change", e => { handleFiles(e.target.files); e.target.value=""; });

function renderThumbs(){
  document.getElementById("photoThumbs").innerHTML = pendingPhotos.map((p,i) => `
    <div class="thumb"><img src="${p}"><button class="rm" onclick="removePhoto(${i})">✕</button><button class="rotate-btn" onclick="rotatePhoto(${i})">↻</button></div>
  `).join("");
}
function removePhoto(i){ pendingPhotos.splice(i,1); renderThumbs(); }
function rotatePhoto(i){
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = img.height;
    canvas.height = img.width;
    const ctx = canvas.getContext("2d");
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(Math.PI/2);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    pendingPhotos[i] = canvas.toDataURL("image/jpeg", 0.85);
    renderThumbs();
  };
  img.src = pendingPhotos[i];
}

function resetForm(switchToList, restoreSavedSession){

    document.getElementById("f-site").value = savedSessionSite || "";

    updateSessionBar();
  }

  renderThumbs();

  document.querySelectorAll(".type-card").forEach(el => el.classList.remove("active"));
  document.getElementById("subGridWrap").style.display = "none";
  document.getElementById("subGrid").innerHTML = "";
  document.getElementById("dimFields").innerHTML = "";

  document.getElementById("cancelEditBtn").style.display = "none";

function cancelEdit(){
  resetForm(true, true);
}

function saveRecord(){
  const site = document.getElementById("f-site").value.trim();
  if(!site){ showToast("請輸入案件/地點名稱"); return; }
  if(!currentType){ showToast("請選擇設施類型"); return; }

  const t = FACILITY_TYPES[currentType];
  const dims = {};
  for(const f of t.fields){
    const val = document.getElementById("dim-"+f.key).value;
    if(!f.optional && !val){ showToast(`請輸入「${f.label}」`); return; }
    if(val) dims[f.key] = parseFloat(val);
  }

  const record = {
    site,
    code: document.getElementById("f-code").value.trim(),
    surveyDate: document.getElementById("f-date").value,
    type: currentType,
    dims,
    notes: document.getElementById("f-notes").value.trim(),
    photos: pendingPhotos,
    gps: gpsData,
    updatedAt: Date.now(),
    createdAt: editingId ? (records[editingId]?.createdAt || Date.now()) : Date.now()
  };

  const wasEditing = !!editingId;
  const ref = editingId ? db.ref(`${DB_PATH}/${editingId}`) : db.ref(DB_PATH).push();
  ref.set(record).then(()=>{
    if(wasEditing){
      showToast("已更新記錄");
      resetForm(true, true);
    } else {
      showToast("已儲存,可繼續新增同案件的下一個設施");
      resetForm(false, false);
    }
  }).catch(err => showToast("儲存失敗："+err.message));
}

--------------------------------------------------------------------- */
function refreshSiteList(){
  const sites = [...new Set(Object.values(records).map(r=>r.site))];
  document.getElementById("siteList").innerHTML = sites.map(s=>`<option value="${s}">`).join("");
}

function renderList(){
  const search = (document.getElementById("searchBox")?.value || "").toLowerCase();
  const list = Object.entries(records)
    .filter(([id,r]) => {
      if(search && !(r.site.toLowerCase().includes(search) || (r.notes||"").toLowerCase().includes(search))) return false;
      return true;
    });

  const container = document.getElementById("recordList");
  if(list.length===0){
    container.innerHTML = `<div class="empty-state"><div>尚無符合的記錄</div></div>`;
    return;
  }

  // 依案件/地點分組
  const groups = {};
  list.forEach(([id,r]) => {
    if(!groups[r.site]) groups[r.site] = [];
    groups[r.site].push([id,r]);
  });
  Object.values(groups).forEach(arr => arr.sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0)));
  const siteNames = Object.keys(groups).sort((a,b) => {
    const at = Math.max(...groups[a].map(([,r]) => r.createdAt||0));
    const bt = Math.max(...groups[b].map(([,r]) => r.createdAt||0));
    return bt - at;
  });

  container.innerHTML = siteNames.map(site => {
    const cards = groups[site].map(([id,r]) => {
      const t = FACILITY_TYPES[r.type];
      const thumb = r.photos && r.photos[0] ? `<img src="${r.photos[0]}">` : (t?t.icon:"");
      return `
        <div class="record-card" onclick="openDetail('${id}')">
          <div class="thumb0">${thumb}</div>
          <div class="rc-body">
            <div class="rc-top"><span class="rc-site">${t?t.label:r.type}${r.code?` <span class="mono" style="color:var(--teal); font-weight:600;">#${escapeHtml(r.code)}</span>`:""}</span><span class="rc-date">${r.surveyDate||""}</span></div>
            <div class="rc-dims">${t?t.dimText(r.dims||{}):""}</div>
          </div>
        </div>`;
    }).join("");
    return `
      <div class="site-group">
        <div class="site-group-header">${escapeHtml(site)}<span class="mono site-group-count">(${groups[site].length})</span></div>
        ${cards}
      </div>`;
  }).join("");
}

function openDetail(id){
  const r = records[id];
  const t = FACILITY_TYPES[r.type];
  const dimRows = t.fields.filter(f=>r.dims && r.dims[f.key]!==undefined)
    .map(f=>`<div class="detail-row"><span class="k">${f.label}</span><span class="mono">${fmt(r.dims[f.key])} ${t.unit}</span></div>`).join("");
  const gallery = (r.photos&&r.photos.length) ? `<div class="gallery">${r.photos.map(p=>`<img src="${p}" onclick="openLightbox('${p}')">`).join("")}</div>` : `<div class="detail-row" style="color:var(--ink-soft)">無照片</div>`;

  document.getElementById("detailBody").innerHTML = `
    <h2>${escapeHtml(r.site)}${r.code?` <span class="mono" style="color:var(--teal); font-size:.85rem;">#${escapeHtml(r.code)}</span>`:""}</h2>
    <div class="rc-type" style="margin-bottom:10px;">${t.label} · ${r.surveyDate||""}</div>
    ${dimRows}
    ${r.gps ? `<div class="detail-row"><span class="k">座標</span><span class="mono">${r.gps.lat.toFixed(6)}, ${r.gps.lng.toFixed(6)}</span></div>` : ""}
    <div class="detail-row"><span class="k">備註</span>${escapeHtml(r.notes||"-")}</div>
    <div class="detail-row"><span class="k">照片</span>${gallery}</div>
    <button class="btn-primary" style="margin-top:14px;" onclick="editRecord('${id}')">編輯</button>
    <button class="btn-secondary" style="color:var(--danger); border-color:var(--danger-soft);" onclick="deleteRecord('${id}')">刪除記錄</button>
  `;
  document.getElementById("detailModal").classList.add("active");
}
function closeDetail(){ document.getElementById("detailModal").classList.remove("active"); }

function editRecord(id){
  const r = records[id];
  closeDetail();
  savedSessionSite = document.getElementById("f-site").value;
  savedSessionDate = document.getElementById("f-date").value;
  document.getElementById("view-session").classList.remove("active");
  document.getElementById("view-list").classList.remove("active");
  document.getElementById("view-add").classList.add("active");
  document.getElementById("tabAddBtn").classList.add("active");
  document.getElementById("tabListBtn").classList.remove("active");
  editingId = id;
  document.getElementById("f-site").value = r.site;
  document.getElementById("f-code").value = r.code || "";
  document.getElementById("f-date").value = r.surveyDate || "";
  updateSessionBar();
  selectGroup(findGroupKey(r.type), r.type);
  Object.entries(r.dims||{}).forEach(([k,v]) => { const el=document.getElementById("dim-"+k); if(el) el.value=v; });
  document.getElementById("f-notes").value = r.notes || "";
  gpsData = r.gps || null;
  document.getElementById("gpsResult").textContent = gpsData ? `${gpsData.lat.toFixed(6)}, ${gpsData.lng.toFixed(6)}` : "";
  pendingPhotos = (r.photos||[]).slice();
  renderThumbs();
  document.getElementById("saveBtn").textContent = "更新記錄";
  document.getElementById("cancelEditBtn").style.display = "block";
  window.scrollTo(0,0);
}

function deleteRecord(id){
  if(!confirm("確定要刪除這筆記錄嗎？此動作無法復原。")) return;
  db.ref(`${DB_PATH}/${id}`).remove().then(()=>{
    closeDetail();
    showToast("已刪除");
  });
}

/* ---------------------------------------------------------------------
   燈箱
--------------------------------------------------------------------- */
function openLightbox(src){
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("active");
}
function closeLightbox(e){ if(e) e.stopPropagation(); document.getElementById("lightbox").classList.remove("active"); }

/* ---------------------------------------------------------------------
   CSV 匯出
--------------------------------------------------------------------- */
function exportCSV(){
  const rows = [["編號","案件/地點","設施類型","尺寸","備註","座標","調查日期"]];
  Object.values(records).forEach(r => {
    const t = FACILITY_TYPES[r.type];
    rows.push([
      r.code||"",
      r.site,
      t?t.label:r.type,
      t?t.dimText(r.dims||{}):"",
      r.notes||"",
      r.gps ? `${r.gps.lat.toFixed(6)}, ${r.gps.lng.toFixed(6)}` : "",
      r.surveyDate||""
    ]);
  });
  const csv = "\uFEFF" + rows.map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `現況調查記錄_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

/* ---------------------------------------------------------------------
   小工具
--------------------------------------------------------------------- */
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 2200);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

--------------------------------------------------------------------- */
buildTypeGrid();
document.getElementById("s-date").value = new Date().toISOString().slice(0,10);
